name: Update Streak Stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@master
        with:
          user_id: YOUR_NUMERIC_USER_ID
          output_path: streak-stats.svg
          theme: tokyonight
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add streak-stats.svg
          git diff --cached --quiet || git commit -m "Update streak stats"
          git push
